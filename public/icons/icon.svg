<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="80" y1="400" x2="432" y2="400" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <line x1="80" y1="300" x2="432" y2="300" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Chart line -->
  <polyline
    points="80,380 150,320 220,350 290,240 360,200 432,160"
    fill="none"
    stroke="url(#line)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Dots -->
  <circle cx="80" cy="380" r="12" fill="#34D399"/>
  <circle cx="150" cy="320" r="12" fill="#34D399"/>
  <circle cx="220" cy="350" r="12" fill="#60A5FA"/>
  <circle cx="290" cy="240" r="14" fill="#60A5FA"/>
  <circle cx="360" cy="200" r="14" fill="#8B5CF6"/>
  <circle cx="432" cy="160" r="16" fill="white"/>
  <!-- R$ text -->
  <text x="256" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="rgba(255,255,255,0.3)">R$</text>
</svg>
